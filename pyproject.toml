[project]
name = "ai-product-council"
version = "0.1.0"
description = "MVP мультиагентного IT-совета для проектирования сервиса или фичи"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.36.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
